name: winggle
description: A campus hub application for students with authentication
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  font_awesome_flutter: ^10.7.0
  
  # Supabase (Backend & Authentication)
  supabase_flutter: ^2.12.2
  
  # Authentication
  google_sign_in: ^6.2.0
  
  # File Handling
  file_picker: ^8.0.0
  
  # State Management
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
